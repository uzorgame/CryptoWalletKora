name: kora_windows
description: "Kora Wallet - Windows Desktop Version"
publish_to: 'none'

version: 5.1.1+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Security (desktop-compatible)
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  
  # Crypto
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  convert: ^3.1.1
  pinenacl: ^0.6.0
  
  # Freezed for immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  # Web3 & Blockchain
  web3dart: ^2.7.3
  http: ^1.2.1
  
  # HTTP client for API requests
  dio: ^5.4.3+1
  
  # WebSocket for real-time prices
  web_socket_channel: ^2.4.5
  uuid: ^4.5.1
  window_manager: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/kora_logo.png
    - assets/Language/

  # The prototype's three faces, and only those. The coin artwork they replaced was eleven
  # bundled PNGs plus a CDN fallback for everything else; a symbol set in the right face
  # identifies an asset better and cannot fail to load.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
